name: Feature request
description: Propose something for the protocol, the SDKs or the apps
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not do today, and who else has this problem?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should change. For protocol changes, say whether it affects consensus (needs a height-gated switch) or only clients.
    validations: { required: true }
